name: Build Linux Native Releases

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'core/**'
      - 'main.cpp'
      - 'ui/**'
      - 'firebase/**'
      - 'Makefile/**'
      - 'build-linux/**'
      - '.github/workflows/build-linux.yml'

jobs:
  build-linux:
    name: Build Linux x86_64 (.deb & .tar.gz)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcapstone-dev libcurl4-openssl-dev pkg-config file

      - name: Configure CMake
        run: |
          cmake -B build -S Makefile \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_GUI=OFF

      - name: Build ROPWeaver Binary
        run: |
          cmake --build build --config Release -j$(nproc)

      - name: Verify Executable
        run: |
          file build/ropweaver
          chmod +x build/ropweaver
          ./build/ropweaver --help

      - name: Build Multi-Batch Test Fixture
        run: |
          g++ -std=c++17 tests/test_endian_readers.cpp -o build/test_endian_readers
          chmod +x build/test_endian_readers
          file build/test_endian_readers

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Firestore Mock Integration Tests
        env:
          ROPWEAVER_EXECUTABLE: ${{ github.workspace }}/build/ropweaver
          ROPWEAVER_MULTI_BATCH_BINARY: ${{ github.workspace }}/build/test_endian_readers
        run: |
          node tests/test_firestore_mock_integration.mjs

      - name: Package Debian (.deb) Release
        run: |
          DEB_STAGE=$(mktemp -d)
          mkdir -p "${DEB_STAGE}/DEBIAN"
          mkdir -p "${DEB_STAGE}/usr/local/bin"
          mkdir -p "${DEB_STAGE}/usr/share/doc/ropweaver"
          mkdir -p "${DEB_STAGE}/etc/ropweaver"

          # Copy binary with explicit executable mode
          cp build/ropweaver "${DEB_STAGE}/usr/local/bin/ropweaver"
          chmod 0755 "${DEB_STAGE}/usr/local/bin/ropweaver"

          # Copy copyright documentation
          if [ -f debian/copyright ]; then
            cp debian/copyright "${DEB_STAGE}/usr/share/doc/ropweaver/copyright"
            chmod 0644 "${DEB_STAGE}/usr/share/doc/ropweaver/copyright"
          fi

          # Copy config
          if [ -f config/firebase_config.json ]; then
            cp config/firebase_config.json "${DEB_STAGE}/etc/ropweaver/firebase_config.json"
          fi

          # Control file
          printf "%s\n" \
            "Package: ropweaver" \
            "Version: 1.6.4" \
            "Section: utils" \
            "Priority: optional" \
            "Architecture: amd64" \
            "Maintainer: Chrisbin Thomas <chrisbin95@users.noreply.github.com>" \
            "Depends: libcapstone4 | libcapstone-dev, libcurl4" \
            "Description: ROPWeaver - Cross-Platform ROP Exploit Generator & Analyzer" \
            " Advanced binary security analysis tool supporting Linux ELF, Windows PE," \
            " and macOS Mach-O binaries for x86, x86_64, ARM, and RISC-V architectures." \
            > "${DEB_STAGE}/DEBIAN/control"

          # Post-installation script to enforce execute permissions
          printf "%s\n" \
            "#!/bin/sh" \
            "set -e" \
            "chmod 0755 /usr/local/bin/ropweaver 2>/dev/null || true" \
            "exit 0" \
            > "${DEB_STAGE}/DEBIAN/postinst"
          chmod 0755 "${DEB_STAGE}/DEBIAN/postinst"

          dpkg-deb --build "${DEB_STAGE}" ropweaver_1.6.4_amd64.deb
          echo "[+] Created ropweaver_1.6.4_amd64.deb ($(du -h ropweaver_1.6.4_amd64.deb | cut -f1))"

      - name: Package Distribution Tarball (.tar.gz)
        run: |
          PKG_DIR="ropweaver-v1.6.4-linux-x86_64"
          mkdir -p "${PKG_DIR}/bin" "${PKG_DIR}/samples" "${PKG_DIR}/config"
          cp build/ropweaver "${PKG_DIR}/bin/ropweaver"
          chmod +x "${PKG_DIR}/bin/ropweaver"
          cp tools/linux_launcher/launcher.sh "${PKG_DIR}/install.sh"
          chmod +x "${PKG_DIR}/install.sh"

          if [ -d test_binaries ]; then
            cp -r test_binaries/* "${PKG_DIR}/samples/" 2>/dev/null || true
          fi
          if [ -f config/firebase_config.json ]; then
            cp config/firebase_config.json "${PKG_DIR}/config/" 2>/dev/null || true
          fi
          cp README.md "${PKG_DIR}/" 2>/dev/null || true
          cp LICENSE "${PKG_DIR}/" 2>/dev/null || true
          cp THIRD_PARTY_NOTICES.txt "${PKG_DIR}/" 2>/dev/null || true

          tar -czvf "ropweaver-v1.6.4-linux-x86_64.tar.gz" "${PKG_DIR}"
          echo "[+] Created ropweaver-v1.6.4-linux-x86_64.tar.gz"

      - name: Verify Archive Contains ELF Executable and Installer
        run: |
          PKG_TAR="ropweaver-v1.6.4-linux-x86_64.tar.gz"
          echo "Inspecting archive: $PKG_TAR"

          # Verify tar contents list
          CONTENTS=$(tar -ztvf "$PKG_TAR")
          echo "$CONTENTS"

          if ! echo "$CONTENTS" | grep -E "bin/ropweaver$"; then
            echo "::error::Archive missing bin/ropweaver"
            exit 1
          fi

          if ! echo "$CONTENTS" | grep -E "install\.sh$"; then
            echo "::error::Archive missing install.sh"
            exit 1
          fi

          # Extract and verify file size and type
          VERIFY_DIR=$(mktemp -d)
          tar -xzf "$PKG_TAR" -C "$VERIFY_DIR"
          EXT_BIN="$VERIFY_DIR/ropweaver-v1.6.4-linux-x86_64/bin/ropweaver"
          EXT_INSTALL="$VERIFY_DIR/ropweaver-v1.6.4-linux-x86_64/install.sh"

          if [ ! -f "$EXT_BIN" ]; then
            echo "::error::Extracted executable not found at $EXT_BIN"
            exit 1
          fi

          if [ ! -x "$EXT_BIN" ]; then
            echo "::error::Extracted executable is not marked executable at $EXT_BIN"
            exit 1
          fi

          if [ ! -f "$EXT_INSTALL" ]; then
            echo "::error::Extracted install.sh not found at $EXT_INSTALL"
            exit 1
          fi

          if [ ! -x "$EXT_INSTALL" ]; then
            echo "::error::Extracted install.sh is not marked executable at $EXT_INSTALL"
            exit 1
          fi

          bash -n "$EXT_INSTALL"

          EXT_SIZE=$(wc -c < "$EXT_BIN")
          echo "Extracted binary size: $EXT_SIZE bytes"
          if [ "$EXT_SIZE" -lt 50000 ]; then
            echo "::error::Extracted binary size ($EXT_SIZE bytes) is too small; executable must be a compiled binary"
            exit 1
          fi

          EXT_FILE=$(file "$EXT_BIN")
          echo "Extracted binary type: $EXT_FILE"
          if ! echo "$EXT_FILE" | grep -q "ELF 64-bit"; then
            echo "::error::Archive contains script or invalid format instead of ELF executable: $EXT_FILE"
            exit 1
          fi

          rm -rf "$VERIFY_DIR"
          echo "[+] Verified: Archive contains real ELF 64-bit executable ($EXT_SIZE bytes) and executable install.sh."

      - name: Upload Debian Package (.deb) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ropweaver-1.6.4-linux-amd64-deb
          path: ropweaver_1.6.4_amd64.deb
          if-no-files-found: error

      - name: Upload Linux Tarball (.tar.gz) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ropweaver-v1.6.4-linux-x86_64-tar
          path: ropweaver-v1.6.4-linux-x86_64.tar.gz
          if-no-files-found: error

